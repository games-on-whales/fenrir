name: Run golangci-lint
on:
  pull_request:

permissions:
  contents: read
  # only-new-issues reads the PR's diff through the API.
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          # main carries ~500 findings from before this config was added, so
          # a full run fails every PR. Report only what the PR introduces.
          only-new-issues: true
