---
# yaml-language-server: $schema=https://github.com/games-on-whales/fenrir/raw/refs/heads/main/schemas/direwolf.games-on-whales.github.io/user_v1alpha1.json
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: User
metadata:
  name: alex
  namespace: direwolf
spec:
  # The GPU is not a resource here: it comes from the App's DRA claim.
  resources:
    limits:
      cpu: 4000m
      memory: 8G
    requests:
      cpu: 4000m
      memory: 8G
  sidecarPolicies:
    # We are overriding the default resources for some sidecars for this user.
    # wolf needs no GPU resource or NVIDIA_* env: the operator gives it the
    # App's GPU claim, and the DRA driver injects the device via CDI.
    wolf:
      resources:
        requests:
          squat.ai/uinput: "1"
          cpu: 1000m
          memory: 2G
        limits:
          squat.ai/uinput: "1"
          cpu: 1000m
          memory: 2G
