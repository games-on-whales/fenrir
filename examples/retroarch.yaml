---
# Base App for RomM ROMs (operator --romm-url / --romm-app=retroarch): the
# operator copies it once per playable ROM in RomM, setting
# $DIREWOLF_LAUNCH_COMMAND to `retroarch -L <core> /romm/library/<rom>`.
# It stays hidden itself; per-ROM copies start visible.
#
# RomM's library (the NAS ROM share) must be mounted read-only at
# /romm/library, as in RomM's own container: RomM's file paths are relative
# to it. romm-library is a ReadWriteMany PVC in this namespace bound to the
# same share RomM mounts.
# yaml-language-server: $schema=https://github.com/games-on-whaless/fenrir/raw/refs/heads/main/schemas/direwolf.games-on-whales.github.io/app_v1alpha1.json
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: retroarch
  namespace: direwolf
spec:
  # GoW's RetroArch icon; each ROM's App gets its RomM cover once fetched.
  appAssetWebP: 
  id: 4
  isHDRSupported: false
  title: RetroArch
  hidden: true
  # A per-ROM setting: copied on create, then the user's.
  gpu:
    memory: 2Gi
  template:
    spec:
      containers:
      - name: app
        image: ghcr.io/games-on-whales/fenrir/retroarch:main
        securityContext:
          capabilities:
            # As in GoW's own RetroArch app config.
            add: ["NET_RAW", "MKNOD", "NET_ADMIN"]
        env:
        - name: RUN_SWAY
          value: "true"
        command:
        - /bin/bash
        - -c
        - |
          cleanup() {
            echo "Cleaning up..." >&2
            exit 0
          }
          trap cleanup SIGINT SIGTERM

          # Wait for wayland display to be available
          while [ ! -S $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY ]; do
            echo "Waiting for wayland display..." >&2
            sleep 1
          done

          while [ ! -S $XDG_RUNTIME_DIR/pulse-socket ]; do
            echo "Waiting for pulse socket..." >&2
            sleep 1
          done

          export PULSE_SINK="$(pactl list sinks short | awk '$2 ~ /^virtual_sink/ {print $2; exit}')"
          export PULSE_SOURCE="${PULSE_SINK}.monitor"
          # The image's startup-app.sh runs $DIREWOLF_LAUNCH_COMMAND.
          exec /entrypoint.sh
        volumeMounts:
        - name: romm-library
          mountPath: /romm/library
          readOnly: true
      volumes:
      - name: romm-library
        persistentVolumeClaim:
          claimName: romm-library
          readOnly: true
