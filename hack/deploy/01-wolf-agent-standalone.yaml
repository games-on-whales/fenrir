---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wolf-dra
  namespace: direwolf-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wolf-dra
rules:
  # DRA: ResourceSlice publishing
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # DRA: read-only on claims/classes/templates
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceclaimtemplates", "deviceclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/status"]
    verbs: ["patch", "update"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses"]
    verbs: ["get"]
  # Needed by kubeletplugin to read node info
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wolf-dra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wolf-dra
subjects:
  - kind: ServiceAccount
    name: wolf-dra
    namespace: direwolf-dev
---
apiVersion: v1
kind: Service
metadata:
  name: wolf-agent
  namespace: direwolf-dev
  labels:
    app: wolf-agent
spec:
  type: LoadBalancer
  selector:
    app: "wolf-agent-dev"
  ports:
    - name: https
      protocol: TCP
      port: 47984
    - name: http
      protocol: TCP
      port: 47989
    - name: rtsp
      protocol: TCP
      port: 48010
    - name: control
      protocol: UDP
      port: 47999
    - name: videortp
      protocol: UDP
      port: 48100
    - name: audiortp
      protocol: UDP
      port: 48200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: wolf-agent-dev
  name: wolf-agent-dev
  namespace: direwolf-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wolf-agent-dev
  template:
    metadata:
      labels:
        app: wolf-agent-dev
    spec:
      serviceAccountName: wolf-dra
      volumes:
      - emptyDir: {}
        name: wolf-sock
      - name: plugins-dir
        hostPath:
          path: /var/lib/kubelet/plugins
          type: DirectoryOrCreate
      - name: plugins-registry
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: DirectoryOrCreate
      - name: sockets-dir
        hostPath:
          path: /var/run/wolf-sockets
          type: DirectoryOrCreate
      - name: cdi-dir
        hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
      - name: wolf-cfg
        configMap:
          name: wolf-cfg
          defaultMode: 0755
      containers:
      # TODO change this to wolf-dra once development is underway 
      - image: wolf-agent-dev
        name: wolf-agent-dev
        imagePullPolicy: IfNotPresent
        env:
        - name: LOG_LEVEL
          value: "5"
        - name: APP_NAME
          value: wolf-agent
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: DRIVER_NAME
          value: wolf.dra.io
        - name: SOCKETS_DIR
          value: /var/run/wolf-sockets
        - name: WOLF_SOCKET_PATH
          value: /etc/wolf/wolf.sock
        - name: MAX_WAYLAND_SOCKETS
          value: "10"
        - name: QUEUE_TIMEOUT_SECONDS
          value: "30"
        - name: WOLF_DRA_ENABLE_SSE
          value: "false"
        - name: TLS_CERT
          value: /etc/wolf/server.crt
        - name: TLS_KEY
          value: /etc/wolf/server.key
        volumeMounts:
        - mountPath: /etc/wolf
          name: wolf-sock
        - name: plugins-dir
          mountPath: /var/lib/kubelet/plugins
        - name: plugins-registry
          mountPath: /var/lib/kubelet/plugins_registry
        - name: sockets-dir
          mountPath: /var/run/wolf-sockets
        - name: cdi-dir
          mountPath: /var/run/cdi
      ## The stable image as of time of this commit
      - image: ghcr.io/games-on-whales/wolf:sha-d6d41de
        name: wolf
        imagePullPolicy: IfNotPresent
        env:
        - name: WOLF_RENDER_NODE
          value: /dev/dri/renderD128
        # I remember this being important but I do not remember why
        # will rediscover this later.
        - name: WOLF_STREAM_CLIENT_IP
          value: 10.244.1.1
        # This is where the wayland & pulseaudio sockets will be created
        - name: XDG_RUNTIME_DIR
          value: /var/run/wolf-sockets
        - name: TZ
          value: UTC
        - name: WOLF_SOCKET_PATH
          value: /etc/wolf/wolf.sock
        - name: WOLF_USE_RTSP_FAKE_IP
          value: "TRUE"
        - name: RTSP_FAKE_IP
          value: "10.89.1.240"
        volumeMounts:
        - name: sockets-dir
          mountPath: /var/run/wolf-sockets
        - mountPath: /etc/wolf
          name: wolf-sock
        - name: wolf-cfg
          mountPath: /etc/wolf/cfg/config.toml
          subPath: config.toml
          readOnly: true
        resources:
          limits:
            cpu: "2"
            devic.es/gpu: "1"
            devic.es/uinput: "1"
            memory: 2G
          requests:
            cpu: "2"
            devic.es/gpu: "1"
            devic.es/uinput: "1"
            memory: 2G
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wolf-cfg
  namespace: direwolf-dev
data:
  config.toml: |
    config_version = 7
    hostname = 'Wolf-node-standalone'
    uuid = ''

    [gstreamer.audio]
    default_audio_params = 'queue max-size-buffers=3 leaky=downstream ! audiorate ! audioconvert'
    default_opus_encoder = 'opusenc bitrate={bitrate} bitrate-type=cbr frame-size={packet_duration} bandwidth=fullband audio-type=restricted-lowdelay max-payload-size=1400'
    default_sink = '''queue ! rtpmoonlightpay_audio name=moonlight_pay packet_duration={packet_duration} encrypt={encrypt} aes_key="{aes_key}" aes_iv="{aes_iv}" !
    appsink name=wolf_udp_sink'''
    default_source = 'interpipesrc name=interpipesrc_{}_audio listen-to={session_id}_audio is-live=true stream-sync=restart-ts max-bytes=0 max-buffers=3 block=false'

    [gstreamer.video]
    default_sink = '''queue ! rtpmoonlightpay_video name=moonlight_pay payload_size={payload_size} fec_percentage={fec_percentage} min_required_fec_packets={min_required_fec_packets} !
    appsink sync=false max-buffers=1 drop=true name=wolf_udp_sink
    '''
    default_source = 'interpipesrc name=interpipesrc_{}_video listen-to={session_id}_video is-live=true stream-sync=restart-ts max-bytes=0 max-buffers=1 leaky-type=downstream'

        [gstreamer.video.defaults.nvcodec]
        video_params = '''cudaupload !
    cudaconvertscale add-borders=true !
    video/x-raw(memory:CUDAMemory), width={width}, height={height}, chroma-site={color_range}, format=NV12, colorimetry={color_space}, pixel-aspect-ratio=1/1'''
        video_params_zero_copy = '''cudaupload !
    cudaconvertscale add-borders=true !
    video/x-raw(memory:CUDAMemory),format=NV12, width={width}, height={height}, pixel-aspect-ratio=1/1
    '''

        [gstreamer.video.defaults.qsv]
        video_params = '''videoconvertscale !
    video/x-raw, chroma-site={color_range}, width={width}, height={height}, format=NV12,
    colorimetry={color_space}, pixel-aspect-ratio=1/1'''
        video_params_zero_copy = '''vapostproc add-borders=true !
    video/x-raw(memory:VAMemory), format=NV12, width={width}, height={height}, pixel-aspect-ratio=1/1'''

        [gstreamer.video.defaults.va]
        video_params = '''vapostproc add-borders=true !
    video/x-raw, chroma-site={color_range}, width={width}, height={height}, format=NV12,
    colorimetry={color_space}, pixel-aspect-ratio=1/1'''
        video_params_zero_copy = '''vapostproc add-borders=true !
    video/x-raw(memory:VAMemory), format=NV12, width={width}, height={height}, pixel-aspect-ratio=1/1'''

        [[gstreamer.video.av1_encoders]]
        check_elements = [ 'nvav1enc', 'cudaconvertscale', 'cudaupload' ]
        encoder_pipeline = '''nvav1enc gop-size=-1 bitrate={bitrate} vbv-buffer-size={vbv_buffer_size} rc-mode=cbr zerolatency=true preset=p1 tune=ultra-low-latency multi-pass=two-pass-quarter !
    av1parse !
    video/x-av1, stream-format=obu-stream, alignment=frame, profile=main'''
        plugin_name = 'nvcodec'

        [[gstreamer.video.av1_encoders]]
        check_elements = [ 'vaav1enc', 'vapostproc' ]
        encoder_pipeline = '''vaav1enc ref-frames=1 bitrate={bitrate} cpb-size={vbv_buffer_size} key-int-max=1024 rate-control=cbr min-qp=20 target-usage=6 !
    av1parse !
    video/x-av1, stream-format=obu-stream, alignment=frame, profile=main'''
        plugin_name = 'va'

        [[gstreamer.video.av1_encoders]]
        check_elements = [ 'vaav1lpenc', 'vapostproc' ]
        encoder_pipeline = '''vaav1lpenc ref-frames=1 bitrate={bitrate} cpb-size={vbv_buffer_size} key-int-max=1024 rate-control=cbr min-qp=20 target-usage=6 !
    av1parse !
    video/x-av1, stream-format=obu-stream, alignment=frame, profile=main'''
        plugin_name = 'va'

        [[gstreamer.video.av1_encoders]]
        check_elements = [ 'qsvav1enc', 'vapostproc' ]
        encoder_pipeline = '''qsvav1enc gop-size=0 ref-frames=1 bitrate={bitrate} rate-control=cbr low-latency=1 target-usage=6 !
    av1parse !
    video/x-av1, stream-format=obu-stream, alignment=frame, profile=main'''
        plugin_name = 'qsv'

        [[gstreamer.video.av1_encoders]]
        check_elements = [ 'av1enc' ]
        encoder_pipeline = '''av1enc usage-profile=realtime end-usage=vbr target-bitrate={bitrate} !
    av1parse !
    video/x-av1, stream-format=obu-stream, alignment=frame, profile=main'''
        plugin_name = 'aom'
        video_params = '''videoconvertscale !
    videorate !
    video/x-raw, width={width}, height={height}, framerate={fps}/1, format=I420,
    chroma-site={color_range}, colorimetry={color_space}'''
        video_params_zero_copy = '''videoconvertscale !
    videorate !
    video/x-raw, width={width}, height={height}, framerate={fps}/1, format=I420,
    chroma-site={color_range}, colorimetry={color_space}'''

        [[gstreamer.video.h264_encoders]]
        check_elements = [ 'nvh264enc', 'cudaconvertscale', 'cudaupload' ]
        encoder_pipeline = '''nvh264enc preset=low-latency-hq zerolatency=true gop-size=0 rc-mode=cbr-ld-hq bitrate={bitrate} vbv-buffer-size={vbv_buffer_size} aud=false !
    h264parse !
    video/x-h264, profile=main, stream-format=byte-stream'''
        plugin_name = 'nvcodec'

        [[gstreamer.video.h264_encoders]]
        check_elements = [ 'vah264enc', 'vapostproc' ]
        encoder_pipeline = '''vah264enc aud=false b-frames=0 ref-frames=1 num-slices={slices_per_frame} bitrate={bitrate} cpb-size={vbv_buffer_size} min-qp=20 key-int-max=1024 rate-control=cbr target-usage=6 !
    h264parse !
    video/x-h264, profile=main, stream-format=byte-stream'''
        plugin_name = 'va'

        [[gstreamer.video.h264_encoders]]
        check_elements = [ 'vah264lpenc', 'vapostproc' ]
        encoder_pipeline = '''vah264lpenc aud=false b-frames=0 ref-frames=1 num-slices={slices_per_frame} bitrate={bitrate} cpb-size={vbv_buffer_size} min-qp=20 key-int-max=1024 rate-control=cbr target-usage=6 !
    h264parse !
    video/x-h264, profile=main, stream-format=byte-stream'''
        plugin_name = 'va'

        [[gstreamer.video.h264_encoders]]
        check_elements = [ 'qsvh264enc', 'vapostproc' ]
        encoder_pipeline = '''qsvh264enc b-frames=0 gop-size=0 idr-interval=1 ref-frames=1 bitrate={bitrate} rate-control=cbr target-usage=6  !
    h264parse !
    video/x-h264, profile=main, stream-format=byte-stream'''
        plugin_name = 'qsv'

        [[gstreamer.video.h264_encoders]]
        check_elements = [ 'x264enc' ]
        encoder_pipeline = '''x264enc pass=qual tune=zerolatency speed-preset=superfast b-adapt=false bframes=0 ref=1
    sliced-threads=true threads={slices_per_frame} option-string="slices={slices_per_frame}:keyint=infinite:open-gop=0"
    b-adapt=false bitrate={bitrate} aud=false !
    video/x-h264, profile=high, stream-format=byte-stream'''
        plugin_name = 'x264'

        [[gstreamer.video.hevc_encoders]]
        check_elements = [ 'nvh265enc', 'cudaconvertscale', 'cudaupload' ]
        encoder_pipeline = '''nvh265enc gop-size=-1 bitrate={bitrate} vbv-buffer-size={vbv_buffer_size} aud=false rc-mode=cbr zerolatency=true preset=p1 tune=ultra-low-latency multi-pass=two-pass-quarter !
    h265parse !
    video/x-h265, profile=main, stream-format=byte-stream'''
        plugin_name = 'nvcodec'

        [[gstreamer.video.hevc_encoders]]
        check_elements = [ 'vah265enc', 'vapostproc' ]
        encoder_pipeline = '''vah265enc aud=false b-frames=0 ref-frames=1 num-slices={slices_per_frame} bitrate={bitrate} cpb-size={vbv_buffer_size} min-qp=20 key-int-max=1024 rate-control=cbr target-usage=6 !
    h265parse !
    video/x-h265, profile=main, stream-format=byte-stream'''
        plugin_name = 'va'

        [[gstreamer.video.hevc_encoders]]
        check_elements = [ 'qsvh265enc', 'vapostproc' ]
        encoder_pipeline = '''qsvh265enc b-frames=0 gop-size=0 idr-interval=1 ref-frames=1 bitrate={bitrate} rate-control=cbr low-latency=1 target-usage=6 !
    h265parse !
    video/x-h265, profile=main, stream-format=byte-stream'''
        plugin_name = 'qsv'

        [[gstreamer.video.hevc_encoders]]
        check_elements = [ 'vah265lpenc', 'vapostproc' ]
        encoder_pipeline = '''vah265lpenc aud=false b-frames=0 ref-frames=1 num-slices={slices_per_frame} bitrate={bitrate} cpb-size={vbv_buffer_size} min-qp=20 key-int-max=1024 rate-control=cbr target-usage=6 !
    h265parse !
    video/x-h265, profile=main, stream-format=byte-stream'''
        plugin_name = 'va'

        [[gstreamer.video.hevc_encoders]]
        check_elements = [ 'x265enc' ]
        encoder_pipeline = '''x265enc tune=zerolatency speed-preset=superfast bitrate={bitrate}
    option-string="info=0:keyint=-1:qp=28:repeat-headers=1:slices={slices_per_frame}:aud=0:annexb=1:log-level=3:open-gop=0:bframes=0:intra-refresh=0" !
    video/x-h265, profile=main, stream-format=byte-stream'''
        plugin_name = 'x265'
        video_params = '''videoconvertscale !
    videorate !
    video/x-raw, width={width}, height={height}, framerate={fps}/1, format=I420,
    chroma-site={color_range}, colorimetry={color_space}'''
        video_params_zero_copy = '''videoconvertscale !
    videorate !
    video/x-raw, width={width}, height={height}, framerate={fps}/1, format=I420,
    chroma-site={color_range}, colorimetry={color_space}'''

