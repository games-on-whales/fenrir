<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Direwolf - Pair</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
            background: rgb(114, 0, 130);
            background: linear-gradient(132deg, rgba(114, 0, 130, 1) 0%, rgba(63, 0, 195, 1) 50%, rgba(0, 71, 255, 1) 100%);
        }

        main {
            color: white;
            max-width: 28rem;
            padding: 1rem;
            text-align: center;
        }

        label.client {
            display: block;
            margin: 0.25rem 0;
            text-align: left;
        }

        input.pin {
            margin: 1rem 0;
            padding: 0.5rem;
            border: 1px solid white;
            width: 8rem;
            text-align: center;
            font-size: 3rem;
            letter-spacing: 0.5rem;
        }

        button, a {
            color: white;
            font-size: 1.25rem;
        }

        /* Chrome, Safari, Edge, Opera */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Firefox */
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>
<main>
    <p>Signed in as <strong>{{.User}}</strong></p>
    {{if .Pending}}
    <form id="pair">
        <p>Enter the PIN Moonlight is showing.</p>
        {{range $i, $p := .Pending}}
        <label class="client">
            <input type="radio" name="secret" value="{{$p.Secret}}" required {{if eq $i 0}}checked{{end}}>
            {{$p.Client}} ({{$p.Age}} ago)
        </label>
        {{end}}
        <input class="pin" name="pin" inputmode="numeric" autocomplete="off" pattern="[0-9]{4}" maxlength="4" required autofocus>
        <br>
        <button type="submit">Pair</button>
    </form>
    <p id="result"></p>
    {{else}}
    <p>No Moonlight client is waiting to pair. Add this server in Moonlight, then reload this page.</p>
    <a href="/pin/">Reload</a>
    {{end}}
</main>
<script>
    const form = document.getElementById("pair");
    if (form) {
        form.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const data = new FormData(form);
            const result = document.getElementById("result");
            result.textContent = "Sending...";
            try {
                const resp = await fetch("/pin/", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({pin: data.get("pin"), secret: data.get("secret")}),
                });
                result.textContent = await resp.text();
                if (resp.ok) form.remove();
            } catch (e) {
                result.textContent = "Failed: " + e;
            }
        });
    }
</script>
</body>
</html>
